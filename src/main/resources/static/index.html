<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello AI World</title>
<style>
  :root {
    color-scheme: light dark;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    text-align: center;
    padding: 2rem;
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #8ec5fc, #e0c3fc, #f9f9ff, #8ec5fc);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
    text-shadow: 0 0 60px rgba(142, 197, 252, 0.25);
  }

  @keyframes shimmer {
    to { background-position: 300% center; }
  }

  p.subtitle {
    margin-top: 1rem;
    margin-bottom: 2.5rem;
    font-size: clamp(0.9rem, 2vw, 1.15rem);
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
  }

  .chat-panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: stretch;
  }

  #messageInput {
    width: 100%;
    padding: 0.9rem 1.1rem;
    font-size: 1rem;
    border-radius: 0.75rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #f4f4ff;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  #messageInput::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }

  #messageInput:focus {
    border-color: #8ec5fc;
    background: rgba(255, 255, 255, 0.12);
  }

  #sendButton {
    padding: 0.9rem 1.1rem;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    border: none;
    border-radius: 0.75rem;
    cursor: pointer;
    color: #0f0c29;
    background: linear-gradient(90deg, #8ec5fc, #e0c3fc);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  #sendButton:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  #sendButton:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #responseBox {
    margin-top: 1.5rem;
    min-height: 3rem;
    padding: 1.1rem 1.25rem;
    border-radius: 0.75rem;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #e8e8ff;
    font-size: 1rem;
    line-height: 1.5;
    text-align: left;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  #responseBox:empty {
    display: none;
  }

  #responseBox.error {
    color: #ff9a9a;
    border-color: rgba(255, 120, 120, 0.35);
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Hello AI World</h1>
    <p class="subtitle">Where curiosity meets code</p>

    <div class="chat-panel">
      <input type="text" id="messageInput" value="Hello" placeholder="Type a message..." />
      <button id="sendButton">Send</button>
      <div id="responseBox"></div>
    </div>
  </div>

  <script>
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const responseBox = document.getElementById('responseBox');

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) {
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = 'Sending...';
      responseBox.classList.remove('error');
      responseBox.textContent = '';

      try {
        const res = await fetch('/hello', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        if (!res.ok) {
          throw new Error(`Request failed with status ${res.status}`);
        }

        const data = await res.json();
        responseBox.textContent = data.response;
      } catch (err) {
        responseBox.classList.add('error');
        responseBox.textContent = `Something went wrong: ${err.message}`;
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
      }
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
